[project]
name = "openaccountants-mcp"
version = "0.4.0"
description = "MCP server giving AI assistants on-demand access to the open-source OpenAccountants tax and accounting guides in a checkout — tax, bookkeeping, payroll, e-invoicing, formation, cross-border (Pillar Two, CBAM, FATCA/CRS, DST) and sector verticals, for every jurisdiction in index.json."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
# The licence text travels with the wheel (dist-info/licenses/LICENSE); a
# copy of the repository's LICENSE lives next to this file for that purpose.
license-files = ["LICENSE"]
# 1.30.0 supplies the HTTP body and stateful-session limits this server uses.
# Early SDKs also lack required FastMCP APIs or localhost Host/Origin protection.
# 2.x removes `mcp.server.fastmcp`; lift the cap only after a reviewed migration.
dependencies = ["mcp>=1.30.0,<2", "pyyaml>=6.0"]
keywords = [
    "tax", "accounting", "mcp", "ai", "accountant", "vat", "gst",
    "income-tax", "open-source", "self-employed", "freelancer",
    "claude", "chatgpt", "llm", "tax-computation", "bookkeeping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://openaccountants.com"
Repository = "https://github.com/ryanduguid/openaccountants"
Issues = "https://github.com/ryanduguid/openaccountants/issues"
Documentation = "https://github.com/ryanduguid/openaccountants/tree/main/mcp"

[project.scripts]
openaccountants-mcp = "openaccountants_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
