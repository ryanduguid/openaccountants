name: Add new country or obligation
description: Request or contribute a new skill for a country or tax obligation
title: "[COUNTRY] Add: "
labels: ["enhancement", "new-skill"]
body:
  - type: input
    id: country
    attributes:
      label: Country
      placeholder: "e.g., Thailand, Nigeria, Chile"
    validations:
      required: true
  - type: dropdown
    id: obligation-type
    attributes:
      label: Obligation type
      options:
        - VAT/GST
        - Income tax
        - Social contributions
        - Estimated tax
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: What you can provide
      description: Check all that apply.
      options:
        - label: I know this country's tax rules and can draft the skill
        - label: I can verify a skill someone else drafts
        - label: I'm requesting this — someone else should build it
  - type: textarea
    id: key-details
    attributes:
      label: Key details (if known)
      description: Standard rate, form name, tax authority, filing deadline.
    validations:
      required: false
