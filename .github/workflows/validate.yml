# PR contract:
#   - Edit skills/** (packages/us-federal/ holds only the hand-authored federal
#     rates JSONs and their runbook). Then run the generators (make build) and
#     commit their output in the same change:
#         python3 scripts/build-packages.py
#         python3 scripts/build-index.py
#         python3 scripts/build-partners.py
#         python3 scripts/build-llms-full.py
#   - packages/** (except us-federal), index.json, PARTNERS.md and llms-full.txt
#     are DERIVED. Nothing outside a pull request regenerates them in this
#     repository, so the change that edits a source is the change that
#     regenerates them. The guard-derived-trees job rebuilds packages/,
#     index.json and llms-full.txt into a temp dir and fails when the committed
#     copies differ — on pull requests and on push to main alike; the coverage
#     gate below re-renders PARTNERS.md the same way.
#   - The validate job checks guide frontmatter: changed files on a pull
#     request, the whole tree on push to main.
#   - The gate-checkers job runs the five gate checkers (arithmetic, bracket
#     tables, expired rules, fact conflicts, coverage claims) against their
#     committed baselines in scripts/baselines/, plus the cited-hosts checker's
#     offline selftest. A finding the baseline does not list, or a baseline
#     entry that no longer reproduces, fails the job; scripts/oa_tools/findings.py
#     documents the flags and CLAUDE.md the workflow for updating a baseline.
#
# The job id guard-derived-trees is kept from the previous contract (it used to
# reject any pull request touching the derived trees, on the theory that a
# platform sync would regenerate them; no such sync exists here) so that an
# existing branch-protection rule naming that context keeps working.

name: Validate Guides

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing in this workflow needs to write. Without this the
# workflow inherits whatever the repository default happens to be.
permissions:
  contents: read

# One run per pull request: a new push cancels the run it supersedes instead
# of queueing behind it. Pushes to main are never cancelled, so every merge
# commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard-derived-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Rebuild packages/, index.json and llms-full.txt and compare with the committed copies
        run: python3 scripts/validate-guides.py --derived-only

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Validate changed guides (PR) / all guides (main)
        # --no-index-check: the freshness checks run in guard-derived-trees.
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth 50
            python3 scripts/validate-guides.py --changed-only --no-index-check
          else
            python3 scripts/validate-guides.py --no-index-check
          fi

  gate-checkers:
    # The gate checkers are stdlib-only, so nothing is installed. Every checker
    # runs even after one fails, so a red job shows the whole picture.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run the gate checkers against their baselines and the cited-hosts selftest
        run: |
          status=0
          for checker in arithmetic bracket-tables expired-rules fact-conflicts coverage-claims; do
            echo "== scripts/check-$checker.py"
            python3 "scripts/check-$checker.py" || status=1
          done
          echo "== scripts/check-cited-hosts.py --selftest"
          python3 scripts/check-cited-hosts.py --selftest || status=1
          exit "$status"
