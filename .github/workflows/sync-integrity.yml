name: Sync Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a new push cancels the run it supersedes instead
# of queueing behind it. Pushes to main are never cancelled, so every merge
# commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-tests
            os: ubuntu-latest
            python: "3.11"
          - name: unit-tests-python-3.10
            os: ubuntu-latest
            python: "3.10"
          - name: unit-tests-windows
            os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            scripts/requirements-validation-ci.txt
            mcp/pyproject.toml
      - name: Install validation dependencies
        run: 'python -m pip install --only-binary :all: --require-hashes -r scripts/requirements-validation-ci.txt'
      - name: Install the workbook test dependency
        run: 'python -m pip install openpyxl==3.1.5 --only-binary :all:'
      - name: Run repo unit tests
        # Discover every test_*.py. A literal single-file pattern silently
        # skipped every other suite in tests/, so reverting the code they
        # cover left CI green.
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install the MCP server and its dependencies
        run: 'python -m pip install --only-binary :all: ./mcp'
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run MCP unit tests
        # mcp/tests/ is a separate top-level directory; without this step the
        # MCP server's own regression suites never execute in CI.
        working-directory: mcp
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check generated files on this platform
        run: python scripts/validate-guides.py --derived-only

  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-validation-ci.txt
      - name: Install validation dependencies
        run: 'python3 -m pip install --only-binary :all: --require-hashes -r scripts/requirements-validation-ci.txt'
      - name: Audit source-guide changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MERGE_BASE=$(git merge-base "$PR_BASE" "$PR_HEAD")
            python3 scripts/check-sync-integrity.py \
              --base "$MERGE_BASE" \
              --head "$PR_HEAD" \
              --mode audit \
              --strict-metadata
          elif [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch push has no base revision; unit tests still ran."
          else
            # This is a last-resort alarm after main changed. Prevention belongs
            # in the platform's CAS preflight and protected PR publication flow.
            python3 scripts/check-sync-integrity.py \
              --base "$PUSH_BASE" \
              --head "$PUSH_HEAD" \
              --mode audit \
              --strict-metadata
          fi
