# Contributor License Agreement check.
#
# SETUP REQUIRED before this becomes a reliable gate:
#   1. Keep the `cla-signatures` branch unprotected. The short-lived, scoped
#      repository GITHUB_TOKEN below writes signatures only to this repository.
#      A separate PAT is required only if signatures are moved to another repo.
#   2. In Settings → Branches, add a branch-protection rule on `main` that makes
#      the "CLA Assistant" status check REQUIRED. (Not enabled automatically —
#      that would also block direct pushes to main.)
#
# Until contributors sign, this workflow intentionally fails the PR check.
# Contributors accept the CLA by commenting
# "I have read the CLA Document and I hereby sign the CLA" on their PR, or by
# ticking the CLA box in the pull request template (see CLA.md).

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed, synchronize]

permissions: {}

jobs:
  cla:
    # Only PR events and the exact CLA/recheck comment on an open PR may reach
    # the third-party action. It never checks out pull-request code.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request && github.event.issue.state == 'open' &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      # The action writes a signature to the unprotected `cla-signatures` branch
      # and posts its result to the pull request; it does not check out PR code.
      contents: write
      pull-requests: write
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/openaccountants/openaccountants/blob/main/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: "Thanks for your contribution. Before we can merge, please confirm you accept the [Contributor License Agreement](CLA.md) by commenting exactly: **I have read the CLA Document and I hereby sign the CLA**"
