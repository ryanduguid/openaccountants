version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # requirements-dev.txt: pytest and openpyxl for contributors.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # scripts/requirements-validation.txt: PyYAML, the one dependency CI installs
  # for the generators and the validator.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # mcp/pyproject.toml: the MCP server's own dependencies.
  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
